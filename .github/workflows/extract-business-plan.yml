name: Validate canonical Business Plan source

on:
  push:
    branches:
      - main
      - "hardening/**"
    paths:
      - "apps-script/**"
      - "hostinger/**"
      - "scripts/**"
      - ".github/workflows/**"
      - "README.md"
  pull_request:
    paths:
      - "apps-script/**"
      - "hostinger/**"
      - "scripts/**"
      - ".github/workflows/**"
      - "README.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: business-plan-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout canonical source
        uses: actions/checkout@v5

      - name: Validate repository contract
        run: python3 scripts/validate_apps_script.py

      - name: JavaScript syntax checks
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            node --check "$file"
          done < <(find apps-script -maxdepth 1 -type f -name '*.js' -print0)

      - name: Verify Hostinger facade target
        shell: bash
        run: |
          set -euo pipefail
          grep -q "AKfycbylpvmb6Cao-Sog2VYdwH9G8PrINOgBCdWFW--49dmT5L_M8efZnd-UQOe9oCXq_J2R" hostinger/index.html

      - name: Canonical source summary
        shell: bash
        run: |
          set -euo pipefail
          echo "SOURCE_OF_TRUTH=apps-script/"
          echo "ZIP_ROLE=ARCHIVE_ONLY"
          echo "SCRIPT_ID=$(python3 -c 'import json; print(json.load(open("apps-script/.clasp.json"))["scriptId"])')"
          echo "VALIDATION_PIPELINE=PASS"
