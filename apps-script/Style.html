<style>
:root {
    --ag-green-950: #032f20;
    --ag-green-900: #06442d;
    --ag-green-800: #075a36;
    --ag-green-700: #0b6b3a;
    --ag-green-600: #168348;
    --ag-lime-500: #6fba16;
    --ag-lime-400: #86ca2d;
    --ag-gold-500: #d5a93b;
    --ag-ink-950: #10231b;
    --ag-ink-800: #243d33;
    --ag-ink-600: #5e7168;
    --ag-ink-500: #74847c;
    --ag-line: #dce7e1;
    --ag-line-strong: #cbdcd3;
    --ag-bg: #f5f8f6;
    --ag-bg-soft: #edf5f0;
    --ag-surface: #ffffff;
    --ag-danger: #b42318;
    --ag-danger-bg: #fff3f1;
    --ag-shadow-sm: 0 8px 24px rgba(6, 68, 45, 0.08);
    --ag-shadow-md: 0 18px 46px rgba(6, 68, 45, 0.12);
    --ag-shadow-lg: 0 30px 80px rgba(6, 68, 45, 0.17);
    --ag-radius-sm: 12px;
    --ag-radius-md: 18px;
    --ag-radius-lg: 26px;
    --ag-radius-xl: 34px;
    --ag-transition: 180ms ease;
  }

  *,
  *::before,
  *::after {
    box-sizing: border-box;
  }

  html {
    min-height: 100%;
    scroll-behavior: smooth;
    background: var(--ag-bg);
  }

  body {
    min-height: 100vh;
    margin: 0;
    color: var(--ag-ink-950);
    background: var(--ag-bg);
    font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    font-size: 16px;
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }

  button,
  input,
  textarea,
  select {
    font: inherit;
  }

  button,
  a {
    -webkit-tap-highlight-color: transparent;
  }

  button {
    border: 0;
  }

  img,
  svg {
    display: block;
  }

  h1,
  h2,
  h3,
  p {
    margin-top: 0;
  }

  ::selection {
    color: #ffffff;
    background: var(--ag-green-700);
  }

  .hidden {
    display: none !important;
  }

  .home-page,
  .journey-page,
  .generation-page {
    min-height: 100vh;
  }

  .home-page {
    position: relative;
    overflow: hidden;
    background:
      radial-gradient(circle at 8% 10%, rgba(111, 186, 22, 0.12), transparent 30%),
      radial-gradient(circle at 92% 18%, rgba(213, 169, 59, 0.12), transparent 24%),
      linear-gradient(180deg, #fbfdfb 0%, #f3f8f5 100%);
  }

  .home-page::before,
  .home-page::after {
    position: absolute;
    z-index: 0;
    content: "";
    pointer-events: none;
    border-radius: 999px;
    filter: blur(1px);
  }

  .home-page::before {
    top: 118px;
    right: -170px;
    width: 410px;
    height: 410px;
    border: 1px solid rgba(11, 107, 58, 0.10);
  }

  .home-page::after {
    bottom: 80px;
    left: -130px;
    width: 270px;
    height: 270px;
    background: rgba(111, 186, 22, 0.05);
  }

  .navbar,
  .hero,
  .features {
    position: relative;
    z-index: 1;
    width: min(1200px, calc(100% - 48px));
    margin-inline: auto;
  }

  .navbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    min-height: 104px;
    gap: 24px;
    padding-block: 18px;
  }

  .logo,
  .brand-link {
    display: inline-flex;
    align-items: center;
    flex: 0 0 auto;
    text-decoration: none;
  }

  .brand-link {
    min-width: 74px;
    padding: 6px;
    border-radius: 16px;
    transition: transform var(--ag-transition), box-shadow var(--ag-transition);
  }

  .brand-link:hover {
    transform: translateY(-2px);
    box-shadow: var(--ag-shadow-sm);
  }

  .brand-link:focus-visible {
    outline: 3px solid rgba(111, 186, 22, 0.32);
    outline-offset: 4px;
  }

  .nav-badge,
  .assistant-badge,
  .label,
  .step-label {
    font-weight: 800;
    letter-spacing: 0.02em;
  }

  .nav-badge {
    display: inline-flex;
    align-items: center;
    min-height: 38px;
    padding: 8px 16px;
    color: var(--ag-green-800);
    background: rgba(255, 255, 255, 0.82);
    border: 1px solid rgba(11, 107, 58, 0.14);
    border-radius: 999px;
    box-shadow: 0 8px 24px rgba(6, 68, 45, 0.05);
    backdrop-filter: blur(12px);
    font-size: 0.82rem;
    text-transform: uppercase;
  }

  .hero {
    display: grid;
    grid-template-columns: minmax(0, 1.08fr) minmax(380px, 0.92fr);
    align-items: center;
    gap: clamp(52px, 8vw, 104px);
    min-height: 620px;
    padding: 56px 0 72px;
  }

  .hero-content {
    max-width: 690px;
    animation: agFadeUp 650ms ease both;
  }

  .label {
    display: inline-flex;
    align-items: center;
    min-height: 34px;
    margin-bottom: 22px;
    padding: 7px 13px;
    color: var(--ag-green-700);
    background: rgba(111, 186, 22, 0.11);
    border: 1px solid rgba(111, 186, 22, 0.17);
    border-radius: 999px;
    font-size: 0.78rem;
    text-transform: uppercase;
  }

  .hero h1 {
    max-width: 760px;
    margin-bottom: 24px;
    color: var(--ag-ink-950);
    font-size: clamp(2.75rem, 5.2vw, 4.8rem);
    font-weight: 850;
    line-height: 1.035;
    letter-spacing: -0.055em;
  }

  .hero h1 span {
    display: block;
    color: var(--ag-green-700);
  }

  .hero-description {
    max-width: 650px;
    margin-bottom: 32px;
    color: var(--ag-ink-600);
    font-size: clamp(1rem, 1.4vw, 1.18rem);
    line-height: 1.8;
  }

  .main-button,
  .secondary-button,
  .back-button {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 11px;
    cursor: pointer;
    border-radius: 14px;
    font-weight: 800;
    transition:
      transform var(--ag-transition),
      box-shadow var(--ag-transition),
      background var(--ag-transition),
      border-color var(--ag-transition),
      color var(--ag-transition),
      opacity var(--ag-transition);
  }

  .main-button {
    min-height: 54px;
    padding: 14px 22px;
    color: #ffffff;
    background: linear-gradient(135deg, var(--ag-green-700), var(--ag-green-600));
    border: 1px solid rgba(255, 255, 255, 0.08);
    box-shadow: 0 14px 28px rgba(11, 107, 58, 0.22);
  }

  .main-button:hover {
    transform: translateY(-2px);
    background: linear-gradient(135deg, var(--ag-green-800), var(--ag-green-700));
    box-shadow: 0 18px 36px rgba(11, 107, 58, 0.28);
  }

  .main-button:active,
  .secondary-button:active,
  .back-button:active {
    transform: translateY(0);
  }

  .main-button:focus-visible,
  .secondary-button:focus-visible,
  .back-button:focus-visible {
    outline: 3px solid rgba(111, 186, 22, 0.32);
    outline-offset: 3px;
  }

  .main-button:disabled,
  .secondary-button:disabled {
    cursor: not-allowed;
    opacity: 0.55;
    transform: none;
    box-shadow: none;
  }

  .large-button {
    min-height: 58px;
    padding-inline: 28px;
  }

  .button-icon,
  .secondary-button svg,
  .back-button svg {
    width: 20px;
    height: 20px;
    flex: 0 0 auto;
  }

  .button-icon-leading {
    order: -1;
  }

  .hero-benefits {
    display: flex;
    flex-wrap: wrap;
    gap: 11px 18px;
    margin-top: 28px;
    color: var(--ag-ink-600);
    font-size: 0.9rem;
  }

  .benefit-item {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    white-space: nowrap;
  }

  .benefit-item svg {
    width: 18px;
    height: 18px;
    color: var(--ag-green-700);
  }

  .hero-card {
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 500px;
    animation: agFadeUp 700ms 100ms ease both;
  }

  .hero-card::before {
    position: absolute;
    inset: 48px 18px 20px 48px;
    content: "";
    background: linear-gradient(145deg, rgba(111, 186, 22, 0.21), rgba(11, 107, 58, 0.10));
    border-radius: 38px;
    transform: rotate(4deg);
  }

  .hero-card::after {
    position: absolute;
    top: 12%;
    right: 0;
    width: 110px;
    height: 110px;
    content: "";
    background: rgba(213, 169, 59, 0.17);
    border-radius: 50%;
    filter: blur(3px);
  }

  .document-preview {
    position: relative;
    z-index: 2;
    width: min(100%, 460px);
    padding: 30px;
    overflow: hidden;
    background: rgba(255, 255, 255, 0.96);
    border: 1px solid rgba(11, 107, 58, 0.10);
    border-radius: 28px;
    box-shadow: var(--ag-shadow-lg);
    transform: rotate(-1.5deg);
  }

  .document-preview::after {
    position: absolute;
    top: 0;
    right: 0;
    width: 120px;
    height: 120px;
    content: "";
    background: linear-gradient(135deg, transparent 48%, rgba(111, 186, 22, 0.05) 49%);
    pointer-events: none;
  }

  .document-header {
    display: flex;
    align-items: center;
    gap: 16px;
    margin-bottom: 28px;
  }

  .mini-logo {
    width: 62px;
    height: 62px;
    flex: 0 0 62px;
    padding: 5px;
    overflow: hidden;
    background: #ffffff;
    border: 1px solid var(--ag-line);
    border-radius: 14px;
    box-shadow: var(--ag-shadow-sm);
  }

  .document-header small {
    display: block;
    margin-bottom: 3px;
    color: var(--ag-green-700);
    font-size: 0.68rem;
    font-weight: 900;
    letter-spacing: 0.14em;
  }

  .document-header strong {
    display: block;
    color: var(--ag-ink-950);
    font-size: 1.06rem;
  }

  .document-title-line,
  .document-line {
    height: 10px;
    background: #e8efeb;
    border-radius: 999px;
  }

  .document-title-line {
    width: 68%;
    height: 16px;
    margin-bottom: 16px;
    background: linear-gradient(90deg, var(--ag-green-800), var(--ag-lime-500));
  }

  .document-line {
    margin-bottom: 10px;
  }

  .document-line.large {
    width: 92%;
  }

  .document-line.medium {
    width: 74%;
  }

  .document-grid {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 14px;
    margin: 28px 0 24px;
  }

  .preview-box {
    min-height: 98px;
    padding: 17px;
    background: var(--ag-bg-soft);
    border: 1px solid rgba(11, 107, 58, 0.08);
    border-radius: 16px;
  }

  .preview-box span,
  .preview-box strong {
    display: block;
  }

  .preview-box span {
    margin-bottom: 5px;
    color: var(--ag-ink-600);
    font-size: 0.78rem;
  }

  .preview-box strong {
    color: var(--ag-green-800);
    font-size: 0.96rem;
  }

  .document-chart {
    display: flex;
    align-items: end;
    gap: 13px;
    height: 116px;
    padding: 18px 18px 0;
    background:
      repeating-linear-gradient(to top, rgba(11, 107, 58, 0.07) 0, rgba(11, 107, 58, 0.07) 1px, transparent 1px, transparent 28px);
    border: 1px solid rgba(11, 107, 58, 0.08);
    border-radius: 16px;
  }

  .bar {
    flex: 1;
    min-width: 18px;
    background: linear-gradient(180deg, var(--ag-lime-400), var(--ag-green-700));
    border-radius: 8px 8px 3px 3px;
    box-shadow: 0 8px 18px rgba(11, 107, 58, 0.12);
  }

  .bar-one { height: 42%; }
  .bar-two { height: 68%; }
  .bar-three { height: 54%; }
  .bar-four { height: 88%; }

  .features {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 20px;
    padding: 24px 0 74px;
  }

  .feature-card {
    position: relative;
    padding: 28px;
    background: rgba(255, 255, 255, 0.82);
    border: 1px solid rgba(11, 107, 58, 0.09);
    border-radius: 22px;
    box-shadow: 0 12px 32px rgba(6, 68, 45, 0.06);
    backdrop-filter: blur(12px);
    transition: transform var(--ag-transition), box-shadow var(--ag-transition), border-color var(--ag-transition);
  }

  .feature-card:hover {
    transform: translateY(-5px);
    border-color: rgba(11, 107, 58, 0.18);
    box-shadow: var(--ag-shadow-md);
  }

  .feature-icon,
  .journey-icon,
  .step-visual,
  .coach-avatar,
  .success-circle {
    display: grid;
    place-items: center;
  }

  .feature-icon {
    width: 50px;
    height: 50px;
    margin-bottom: 20px;
    color: var(--ag-green-700);
    background: rgba(111, 186, 22, 0.11);
    border: 1px solid rgba(111, 186, 22, 0.16);
    border-radius: 15px;
  }

  .feature-icon svg {
    width: 25px;
    height: 25px;
  }

  .feature-card h3 {
    margin-bottom: 10px;
    color: var(--ag-ink-950);
    font-size: 1.08rem;
    line-height: 1.35;
  }

  .feature-card p {
    margin-bottom: 0;
    color: var(--ag-ink-600);
    font-size: 0.93rem;
    line-height: 1.75;
  }

  .journey-page,
  .generation-page {
    background:
      radial-gradient(circle at 10% 12%, rgba(111, 186, 22, 0.11), transparent 30%),
      radial-gradient(circle at 88% 90%, rgba(213, 169, 59, 0.10), transparent 26%),
      var(--ag-bg);
  }

  .journey-shell {
    width: min(1040px, calc(100% - 40px));
    min-height: 100vh;
    margin-inline: auto;
    padding: 34px 0 56px;
  }

  .intro-shell {
    display: flex;
    flex-direction: column;
  }

  .back-button {
    align-self: flex-start;
    min-height: 42px;
    padding: 9px 13px;
    color: var(--ag-ink-600);
    background: transparent;
  }

  .back-button:hover {
    color: var(--ag-green-700);
    background: rgba(11, 107, 58, 0.07);
  }

  .intro-content {
    width: min(100%, 780px);
    margin: auto;
    padding: clamp(34px, 6vw, 64px);
    text-align: center;
    background: rgba(255, 255, 255, 0.93);
    border: 1px solid rgba(11, 107, 58, 0.10);
    border-radius: var(--ag-radius-xl);
    box-shadow: var(--ag-shadow-lg);
    animation: agFadeUp 550ms ease both;
  }

  .journey-icon {
    width: 74px;
    height: 74px;
    margin: 0 auto 18px;
    color: #ffffff;
    background: linear-gradient(145deg, var(--ag-green-700), var(--ag-lime-500));
    border: 8px solid rgba(111, 186, 22, 0.12);
    border-radius: 24px;
    box-shadow: 0 18px 38px rgba(11, 107, 58, 0.24);
  }

  .journey-icon svg {
    width: 38px;
    height: 38px;
  }

  .assistant-badge {
    display: inline-flex;
    margin-bottom: 18px;
    padding: 7px 13px;
    color: var(--ag-green-700);
    background: rgba(111, 186, 22, 0.10);
    border-radius: 999px;
    font-size: 0.76rem;
    text-transform: uppercase;
  }

  .intro-content h2,
  .generation-card h2,
  .result-card h2 {
    margin-bottom: 16px;
    color: var(--ag-ink-950);
    font-size: clamp(2rem, 4vw, 3.15rem);
    font-weight: 850;
    line-height: 1.1;
    letter-spacing: -0.035em;
  }

  .intro-content > p {
    max-width: 640px;
    margin: 0 auto 30px;
    color: var(--ag-ink-600);
    font-size: 1.04rem;
  }

  .intro-promise {
    display: grid;
    gap: 12px;
    margin: 30px 0 34px;
    text-align: left;
  }

  .intro-promise > div {
    display: flex;
    align-items: center;
    gap: 15px;
    padding: 15px 17px;
    background: var(--ag-bg-soft);
    border: 1px solid rgba(11, 107, 58, 0.08);
    border-radius: 16px;
  }

  .promise-icon {
    display: grid;
    width: 42px;
    height: 42px;
    flex: 0 0 42px;
    place-items: center;
    color: var(--ag-green-700);
    background: #ffffff;
    border-radius: 12px;
    box-shadow: 0 7px 18px rgba(6, 68, 45, 0.08);
  }

  .promise-icon svg {
    width: 22px;
    height: 22px;
  }

  .promise-copy,
  .promise-copy strong,
  .promise-copy span {
    display: block;
  }

  .promise-copy strong {
    color: var(--ag-ink-950);
    font-size: 0.95rem;
  }

  .promise-copy span {
    color: var(--ag-ink-600);
    font-size: 0.86rem;
  }

  .questionnaire-layout {
    display: grid;
    grid-template-columns: 330px minmax(0, 1fr);
    min-height: 100vh;
  }

  .coach-panel {
    position: sticky;
    top: 0;
    display: flex;
    flex-direction: column;
    min-height: 100vh;
    padding: 34px 30px;
    overflow: hidden;
    color: #ffffff;
    background:
      radial-gradient(circle at 15% 0%, rgba(134, 202, 45, 0.24), transparent 32%),
      linear-gradient(165deg, var(--ag-green-900), var(--ag-green-950));
  }

  .coach-panel::after {
    position: absolute;
    right: -100px;
    bottom: -120px;
    width: 290px;
    height: 290px;
    content: "";
    border: 1px solid rgba(255, 255, 255, 0.08);
    border-radius: 50%;
  }

  .coach-logo {
    position: relative;
    z-index: 1;
    width: 112px;
    margin: 0 auto 28px;
    padding: 8px;
    background: #ffffff;
    border: 1px solid rgba(255, 255, 255, 0.24);
    border-radius: 18px;
    box-shadow: 0 16px 34px rgba(0, 0, 0, 0.16);
  }

  .coach-avatar {
    position: relative;
    z-index: 1;
    width: 70px;
    height: 70px;
    margin: 6px auto 16px;
    color: #ffffff;
    background: rgba(255, 255, 255, 0.11);
    border: 1px solid rgba(255, 255, 255, 0.18);
    border-radius: 22px;
    backdrop-filter: blur(10px);
  }

  .coach-avatar svg {
    width: 34px;
    height: 34px;
  }

  .coach-title {
    position: relative;
    z-index: 1;
    margin-bottom: 16px;
    text-align: center;
    font-size: 0.78rem;
    font-weight: 900;
    letter-spacing: 0.12em;
    text-transform: uppercase;
  }

  .coach-message {
    position: relative;
    z-index: 1;
    margin: 0 0 22px;
    color: rgba(255, 255, 255, 0.92);
    text-align: center;
    font-size: 1.04rem;
    line-height: 1.75;
  }

  .coach-progress-message {
    position: relative;
    z-index: 1;
    display: flex;
    align-items: flex-start;
    gap: 11px;
    padding: 15px;
    color: #ffffff;
    background: rgba(255, 255, 255, 0.10);
    border: 1px solid rgba(255, 255, 255, 0.14);
    border-radius: 16px;
    font-size: 0.88rem;
    line-height: 1.55;
  }

  .coach-progress-icon {
    width: 20px;
    height: 20px;
    flex: 0 0 20px;
    margin-top: 1px;
    color: var(--ag-lime-400);
  }

  .coach-security {
    position: relative;
    z-index: 1;
    display: flex;
    align-items: flex-start;
    gap: 10px;
    margin-top: auto;
    padding-top: 26px;
    color: rgba(255, 255, 255, 0.68);
    font-size: 0.76rem;
    line-height: 1.55;
  }

  .coach-security svg {
    width: 18px;
    height: 18px;
    flex: 0 0 18px;
    margin-top: 1px;
    color: var(--ag-lime-400);
  }

  .questionnaire-main {
    min-width: 0;
    padding: 30px clamp(26px, 5vw, 74px) 56px;
  }

  .questionnaire-topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    width: min(100%, 920px);
    margin: 0 auto 14px;
    gap: 18px;
  }

  .questionnaire-topbar > span {
    color: var(--ag-green-800);
    font-size: 0.86rem;
    font-weight: 850;
    letter-spacing: 0.02em;
  }

  .progress-track {
    width: min(100%, 920px);
    height: 8px;
    margin: 0 auto 26px;
    overflow: hidden;
    background: #dde9e2;
    border-radius: 999px;
  }

  .progress-bar {
    width: 16.6667%;
    height: 100%;
    background: linear-gradient(90deg, var(--ag-green-700), var(--ag-lime-500));
    border-radius: inherit;
    box-shadow: 0 0 18px rgba(111, 186, 22, 0.28);
    transition: width 420ms cubic-bezier(0.22, 1, 0.36, 1);
  }

  .question-card {
    width: min(100%, 920px);
    min-height: 620px;
    margin-inline: auto;
    padding: clamp(28px, 5vw, 52px);
    background: rgba(255, 255, 255, 0.96);
    border: 1px solid rgba(11, 107, 58, 0.10);
    border-radius: 28px;
    box-shadow: var(--ag-shadow-md);
  }

  .form-step {
    display: none;
  }

  .form-step.active-step {
    display: block;
    animation: agStepIn 420ms ease both;
  }

  .step-visual {
    width: 58px;
    height: 58px;
    margin-bottom: 18px;
    color: var(--ag-green-700);
    background: rgba(111, 186, 22, 0.11);
    border: 1px solid rgba(111, 186, 22, 0.17);
    border-radius: 17px;
  }
