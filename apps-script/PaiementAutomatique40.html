<style>
  .agp-bancable-contact {
    font-family: inherit;
    cursor: pointer;
  }

  .agp-payment-status {
    display: none;
    margin-top: 14px;
    padding: 14px 16px;
    border: 1px solid rgba(11, 107, 58, 0.16);
    border-radius: 14px;
    background: #f7fbf8;
    color: #3e5f51;
    font-size: 0.85rem;
    line-height: 1.55;
    text-align: left;
  }

  .agp-payment-status.is-visible {
    display: block;
  }

  .agp-payment-status.is-pending {
    border-color: rgba(184, 134, 34, 0.24);
    background: #fffaf0;
    color: #72551d;
  }

  .agp-payment-status.is-success {
    border-color: rgba(22, 138, 80, 0.28);
    background: #eefaf2;
    color: #14532d;
  }

  .agp-payment-status.is-error {
    border-color: rgba(185, 28, 28, 0.20);
    background: #fff5f5;
    color: #8f1d1d;
  }

  .agp-payment-status strong {
    display: block;
    margin-bottom: 3px;
    color: inherit;
  }

  .agp-payment-status a {
    display: inline-flex;
    margin-top: 10px;
    color: #0b6b3a;
    font-weight: 850;
  }

  .agp-bancable-contact[disabled] {
    cursor: wait;
    opacity: 0.72;
    transform: none;
  }

  .agp-payment-ref {
    display: inline-block;
    margin-top: 7px;
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size: 0.76rem;
    letter-spacing: 0.02em;
  }
</style>

<script>
(function () {
  'use strict';

  var STORAGE_KEY = 'afrigreen24_bancable_payment_v4';
  var POLL_INTERVAL = 6000;
  var POLL_MAX_DURATION = 30 * 60 * 1000;
  var pollingTimer = null;
  var pollingStartedAt = 0;
  var paymentWindow = null;

  function byId(id) {
    return document.getElementById(id);
  }

  function fieldValue(id) {
    var field = byId(id);
    return field ? String(field.value || '').trim() : '';
  }

  function setButtonState(busy, text) {
    var button = byId('bancableContactLink');
    if (!button) return;
    button.disabled = Boolean(busy);
    button.setAttribute('aria-busy', busy ? 'true' : 'false');
    var label = button.querySelector('span');
    if (label && text) label.textContent = text;
  }

  function showStatus(type, title, message, link, paymentRef) {
    var box = byId('bancablePaymentStatus');
    if (!box) return;

    box.className = 'agp-payment-status is-visible' + (type ? ' is-' + type : '');
    var html = '<strong>' + escapeHtml(title || '') + '</strong>' + escapeHtml(message || '');

    if (paymentRef) {
      html += '<span class="agp-payment-ref">Référence : ' + escapeHtml(paymentRef) + '</span>';
    }

    if (link) {
      html += '<br><a id="agpContinueBancableLink" href="' + escapeHtml(link) + '" target="_top">Continuer vers le Business Plan Bancable</a>';
    }

    box.innerHTML = html;
  }

  function escapeHtml(text) {
    return String(text || '')
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#039;');
  }

  function saveSession(session) {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(session));
    } catch (error) {
      console.warn('Sauvegarde de la session de paiement impossible :', error);
    }
  }

  function readSession() {
    try {
      var raw = localStorage.getItem(STORAGE_KEY);
      return raw ? JSON.parse(raw) : null;
    } catch (error) {
      return null;
    }
  }

  function clearSession() {
    try {
      localStorage.removeItem(STORAGE_KEY);
    } catch (error) {
      console.warn('Suppression de la session de paiement impossible :', error);
    }
  }

  function serverCall(functionName, args) {
    return new Promise(function (resolve, reject) {
      if (!window.google || !google.script || !google.script.run) {
        reject(new Error('Le serveur AfriGreen24 est indisponible. Rechargez la page.'));
        return;
      }

      var runner = google.script.run
        .withSuccessHandler(resolve)
        .withFailureHandler(function (error) {
          reject(new Error(error && error.message ? error.message : String(error)));
        });

      runner[functionName].apply(runner, args || []);
    });
  }

  function ensureDossier() {
    if (window.businessPlanDossierId) {
      return Promise.resolve(String(window.businessPlanDossierId));
    }

    if (typeof window.enregistrerTransitionStandardSiNecessaire === 'function') {
      return Promise.resolve(window.enregistrerTransitionStandardSiNecessaire())
        .then(function (result) {
          var dossierId = result && result.dossierId
            ? result.dossierId
            : window.businessPlanDossierId;
          if (!dossierId) throw new Error('Le dossier Standard n’a pas encore été enregistré.');
          return String(dossierId);
        });
    }

    return Promise.reject(new Error('Transition Standard vers Bancable indisponible.'));
  }

  function openCheckout(url) {
    if (paymentWindow && !paymentWindow.closed) {
      paymentWindow.location.href = url;
      paymentWindow.focus();
      return;
    }

    var opened = window.open(url, '_blank', 'noopener,noreferrer');
    if (!opened) {
      window.location.href = url;
    }
  }

  function startPayment() {
    setButtonState(true, 'Préparation du paiement…');
    showStatus('pending', 'Préparation sécurisée', 'Création de votre référence de paiement AfriGreen24…');

    try {
      paymentWindow = window.open('', '_blank');
      if (paymentWindow) {
        paymentWindow.document.write('<p style="font-family:Arial,sans-serif;padding:24px">Préparation du paiement sécurisé…</p>');
      }
    } catch (error) {
      paymentWindow = null;
    }

    ensureDossier()
      .then(function (dossierId) {
        return serverCall('creerSessionPaiementBancable', [
          dossierId,
          fieldValue('email'),
          fieldValue('promoterName'),
          fieldValue('phone') || fieldValue('telephone')
        ]);
      })
      .then(function (session) {
        if (!session || !session.succes) {
          throw new Error(session && session.message ? session.message : 'Session de paiement non créée.');
        }

        saveSession({
          paymentRef: session.paymentRef,
          dossierId: session.dossierId,
          checkoutUrl: session.checkoutUrl,
          createdAt: new Date().toISOString()
        });

        if (session.statut === 'ACCES_BANCABLE_ACTIF' && session.lienBancable) {
          activateAccess(session);
          return;
        }

        showStatus(
          'pending',
          'Paiement en attente de confirmation',
          'Terminez le paiement sur Selar. Cette page vérifiera automatiquement la transaction.',
          '',
          session.paymentRef
        );
        setButtonState(false, 'Rouvrir le paiement');
        openCheckout(session.checkoutUrl);
        startPolling(session.paymentRef, session.dossierId);
      })
      .catch(function (error) {
        if (paymentWindow && !paymentWindow.closed) paymentWindow.close();
        showStatus('error', 'Paiement non préparé', error.message || String(error));
        setButtonState(false, 'Réessayer le paiement');
      });
  }

  function startPolling(paymentRef, dossierId) {
    stopPolling();
    pollingStartedAt = Date.now();

    function check() {
      if (Date.now() - pollingStartedAt > POLL_MAX_DURATION) {
        stopPolling();
        showStatus(
          'pending',
          'Confirmation toujours en attente',
          'Votre accès sera également envoyé par email dès que Selar aura confirmé le paiement.',
          '',
          paymentRef
        );
        return;
      }

      serverCall('obtenirStatutPaiementBancable', [paymentRef, dossierId])
        .then(function (status) {
          if (!status || !status.succes) return;

          if (status.statut === 'ACCES_BANCABLE_ACTIF' && status.lienBancable) {
            activateAccess(status);
            return;
          }

          if (status.statut === 'PAIEMENT_CONFIRME') {
            showStatus(
              'pending',
              'Paiement confirmé',
              'Votre accès Bancable est en cours d’activation.',
              '',
              paymentRef
            );
          } else if (status.statut === 'ERREUR_ACTIVATION') {
            showStatus(
              'pending',
              'Paiement reçu',
              'Une vérification technique est en cours. Votre paiement n’est pas perdu.',
              '',
              paymentRef
            );
          } else if (status.statut === 'EXPIREE') {
            stopPolling();
            clearSession();
            showStatus('error', 'Session expirée', 'Cliquez à nouveau sur le bouton pour créer une nouvelle session de paiement.');
            setButtonState(false, 'Payer et continuer');
          }
        })
        .catch(function (error) {
          console.warn('Vérification du paiement impossible :', error);
        });
    }

    check();
    pollingTimer = window.setInterval(check, POLL_INTERVAL);
  }

  function stopPolling() {
    if (pollingTimer) {
      window.clearInterval(pollingTimer);
      pollingTimer = null;
    }
  }

  function activateAccess(status) {
    stopPolling();
    clearSession();
    setButtonState(true, 'Accès activé');
    showStatus(
      'success',
      'Paiement confirmé — accès activé',
      'Votre dossier Standard a été repris. Vous pouvez maintenant compléter la partie Bancable.',
      status.lienBancable,
      status.paymentRef
    );

    window.setTimeout(function () {
      var link = byId('agpContinueBancableLink');
      if (link) link.click();
    }, 1800);
  }

  function restorePendingSession() {
    var resultPage = byId('resultPage');
    if (resultPage && resultPage.classList.contains('hidden')) return false;

    var session = readSession();
    if (!session || !session.paymentRef || !session.dossierId) return false;

    var currentDossier = String(window.businessPlanDossierId || '');
    if (currentDossier && currentDossier !== String(session.dossierId)) return false;

    showStatus(
      'pending',
      'Vérification de votre paiement',
      'Une session de paiement précédente a été retrouvée.',
      '',
      session.paymentRef
    );
    setButtonState(false, 'Rouvrir le paiement');
    startPolling(session.paymentRef, session.dossierId);
    return true;
  }

  function prepare() {
    var button = byId('bancableContactLink');
    if (!button || button.__agpPaymentInstalled) return;

    button.__agpPaymentInstalled = true;
    button.addEventListener('click', function (event) {
      event.preventDefault();

      var session = readSession();
      if (session && session.checkoutUrl) {
        openCheckout(session.checkoutUrl);
        startPolling(session.paymentRef, session.dossierId);
        showStatus(
          'pending',
          'Paiement en attente de confirmation',
          'La page Selar a été rouverte. Cette page continue la vérification automatiquement.',
          '',
          session.paymentRef
        );
        return;
      }

      startPayment();
    });

    restorePendingSession();
  }

  function initialize() {
    prepare();

    document.addEventListener('visibilitychange', function () {
      if (!document.hidden) restorePendingSession();
    });

    window.addEventListener('pageshow', restorePendingSession);
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', initialize);
  } else {
    initialize();
  }

  window.AfriGreen24Payment40 = {
    prepare: prepare,
    restore: restorePendingSession,
    clear: clearSession,
    start: startPayment
  };
})();
</script>
