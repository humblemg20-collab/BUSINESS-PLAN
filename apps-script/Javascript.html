<script>
  "use strict";

  let etapeActuelle = 1;
  const nombreEtapes = 6;
  let generationEnCours = false;

  const coachMessages = {
    1: {
      message: "Avant de parler de chiffres, commençons par comprendre votre vision.",
      progression: "Votre idée prend forme."
    },
    2: {
      message: "Les projets les plus utiles commencent toujours par un problème réel.",
      progression: "Vous définissez la raison d’être de votre projet."
    },
    3: {
      message: "Montrons maintenant comment votre solution peut changer la situation.",
      progression: "Votre entreprise commence à devenir concrète."
    },
    4: {
      message: "Identifions précisément les personnes que votre projet veut servir.",
      progression: "Vos futurs clients deviennent plus clairs."
    },
    5: {
      message: "Construisons maintenant un modèle économique capable de durer.",
      progression: "Votre modèle économique se structure."
    },
    6: {
      message: "Dernière étape : définissons les moyens nécessaires pour passer à l’action.",
      progression: "Votre projet est prêt à franchir un nouveau cap."
    }
  };

  const champsObligatoires = {
    1: ["projectName", "promoterName", "email", "country", "stage"],
    2: ["problem", "affectedPeople", "urgency"],
    3: ["solution", "valueProposition", "benefit"],
    4: ["targetCustomers", "marketArea", "salesChannels", "competitors"],
    5: ["revenueModel", "pricing", "sector", "mainCosts", "team"],
    6: ["fundingType", "fundingNeed", "useOfFunds", "impact", "risks"]
  };

  const confirmations = {
    1: {
      titre: "Excellent.",
      texte: "Votre projet possède maintenant une identité claire."
    },
    2: {
      titre: "Très bien.",
      texte: "Vous venez de définir la raison d’être de votre projet."
    },
    3: {
      titre: "Votre solution est claire.",
      texte: "Votre proposition de valeur est désormais structurée."
    },
    4: {
      titre: "Votre marché prend forme.",
      texte: "Nous comprenons maintenant qui sont vos futurs clients."
    },
    5: {
      titre: "Votre modèle devient concret.",
      texte: "Votre projet possède maintenant une logique économique."
    }
  };

  const etapesGeneration = [
    {
      titre: "Analyse de votre projet...",
      texte: "Nous relisons votre vision et vos objectifs."
    },
    {
      titre: "Construction de la stratégie...",
      texte: "Nous organisons votre proposition de valeur et votre marché."
    },
    {
      titre: "Rédaction du Business Plan...",
      texte: "Nous transformons vos réponses en un document structuré."
    },
    {
      titre: "Création du document...",
      texte: "Nous préparons votre Business Plan professionnel."
    }
  ];

  function obtenirElement(id) {
    return document.getElementById(id);
  }

  function afficherPage(idPage) {
    const pages = [
      "homePage",
      "importBusinessPlanPage",
      "businessPlanCompletionPage",
      "introPage",
      "questionnairePage",
      "businessPlanDesignPage",
      "generationPage",
      "resultPage"
    ];

    pages.forEach(function(id) {
      const page = obtenirElement(id);
      if (page) {
        page.classList.add("hidden");
      }
    });

    const pageDemandee = obtenirElement(idPage);
    if (pageDemandee) {
      pageDemandee.classList.remove("hidden");
    }

    window.scrollTo({
      top: 0,
      behavior: respecterMouvementReduit() ? "auto" : "smooth"
    });
  }

  function ouvrirIntroduction() {
    masquerErreur();
    afficherPage("introPage");
  }

  function retourAccueil() {
    masquerErreur();
    afficherPage("homePage");
  }

  function retourAccueilComplet() {
    etapeActuelle = 1;
    generationEnCours = false;
    reinitialiserAnimation();
    mettreAJourEtape(false);
    afficherPage("homePage");
  }

  function demarrerQuestionnaire() {
    etapeActuelle = 1;
    masquerErreur();
    mettreAJourEtape(false);
    afficherPage("questionnairePage");
  }

  function etapeSuivante() {
    masquerErreur();

    if (!validerEtapeActuelle()) {
      if (!obtenirElement("formError").textContent) {
        afficherErreur(
          "Complétez les informations indiquées avant de continuer."
        );
      }
      return;
    }

    if (etapeActuelle < nombreEtapes) {
      afficherConfirmationEtape();
      return;
    }

    if (estParcoursFinanceurDirect_()) {
      lancerParcoursFinalFinanceur_();
      return;
    }

    ouvrirChoixDesignBusinessPlan(
      "questionnaire"
    );
  }

  function etapePrecedente() {
    masquerErreur();

    if (etapeActuelle > 1) {
      etapeActuelle -= 1;
      mettreAJourEtape();
      return;
    }

    afficherPage("introPage");
  }

  function mettreAJourEtape(defilementActif) {
    const doitDefiler = defilementActif !== false;
    const etapes = document.querySelectorAll(".form-step");

    etapes.forEach(function(etape) {
      const numero = Number(etape.dataset.step);
      etape.classList.toggle("active-step", numero === etapeActuelle);
      etape.setAttribute("aria-hidden", numero === etapeActuelle ? "false" : "true");
    });

    const progression = (etapeActuelle / nombreEtapes) * 100;
    const barre = obtenirElement("progressBar");
    const compteur = obtenirElement("stepCounter");
    const messageCoach = obtenirElement("coachMessage");
    const messageProgression = obtenirElement("progressEmotion");

    if (barre) {
      barre.style.width = progression + "%";
      barre.setAttribute("aria-valuenow", String(etapeActuelle));
      barre.setAttribute("aria-valuemin", "1");
      barre.setAttribute("aria-valuemax", String(nombreEtapes));
      barre.setAttribute("role", "progressbar");
      barre.setAttribute(
        "aria-label",
        "Progression du questionnaire : étape " + etapeActuelle + " sur " + nombreEtapes
      );
    }

    if (compteur) {
      compteur.textContent = "Étape " + etapeActuelle + " sur " + nombreEtapes;
    }

    if (messageCoach) {
      messageCoach.textContent = coachMessages[etapeActuelle].message;
    }

    if (messageProgression) {
      messageProgression.textContent = coachMessages[etapeActuelle].progression;
    }

    const boutonPrecedent = obtenirElement("previousButton");
    if (boutonPrecedent) {
      boutonPrecedent.style.visibility = etapeActuelle === 1 ? "hidden" : "visible";
      boutonPrecedent.disabled = etapeActuelle === 1;
    }

    const boutonSuivant = obtenirElement("nextButton");
    if (boutonSuivant) {
      const libelle = boutonSuivant.querySelector("span");
      if (libelle) {
        libelle.textContent =
          etapeActuelle === nombreEtapes
            ? "Générer mon Business Plan"
            : "Continuer";
      }
      boutonSuivant.setAttribute(
        "aria-label",
        etapeActuelle === nombreEtapes
          ? "Générer mon Business Plan"
          : "Continuer vers l’étape suivante"
      );
    }

    if (doitDefiler) {
      window.scrollTo({
        top: 0,
        behavior: respecterMouvementReduit() ? "auto" : "smooth"
      });
    }
  }

  function validerEtapeActuelle() {
    const ids = champsObligatoires[etapeActuelle] || [];
    let premierChampInvalide = null;

    ids.forEach(function(id) {
      const champ = obtenirElement(id);
      if (!champ) {
        return;
      }

      nettoyerEtatChamp(champ);

      if (!String(champ.value || "").trim()) {
        marquerChampInvalide(champ);
        if (!premierChampInvalide) {
          premierChampInvalide = champ;
        }
      }
    });

    if (premierChampInvalide) {
      afficherErreur("Tous les champs de cette étape sont nécessaires.");
      premierChampInvalide.focus();
      premierChampInvalide.scrollIntoView({
        behavior: respecterMouvementReduit() ? "auto" : "smooth",
        block: "center"
      });
      return false;
    }

    if (etapeActuelle === 1) {
      const champEmail = obtenirElement("email");
      const email = champEmail ? champEmail.value.trim() : "";
      const emailValide = /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);

      if (!emailValide) {
        marquerChampInvalide(champEmail);
        afficherErreur("Saisissez une adresse e-mail valide.");
        champEmail.focus();
        return false;
      }
    }

    return true;
  }

  function marquerChampInvalide(champ) {
    if (!champ) {
      return;
    }

    champ.setAttribute("aria-invalid", "true");
    champ.style.borderColor = "#b42318";
    champ.style.boxShadow = "0 0 0 4px rgba(180, 35, 24, 0.08)";
  }

  function nettoyerEtatChamp(champ) {
    if (!champ) {
      return;
    }

    champ.removeAttribute("aria-invalid");
    champ.style.borderColor = "";
    champ.style.boxShadow = "";
  }

  function afficherConfirmationEtape() {
    const confirmation = confirmations[etapeActuelle];

    if (!confirmation) {
      etapeActuelle += 1;
      mettreAJourEtape();
      return;
    }

    const overlay = document.createElement("div");
    overlay.className = "ag-step-confirmation-overlay";
    overlay.setAttribute("role", "dialog");
    overlay.setAttribute("aria-modal", "true");
    overlay.setAttribute("aria-label", confirmation.titre);

    overlay.innerHTML =
      '<div class="ag-step-confirmation">' +
        '<div class="success-circle" aria-hidden="true">' +
          '<svg><use href="#icon-check"></use></svg>' +
        '</div>' +
        '<h2></h2>' +
        '<p></p>' +
        '<div class="ag-mini-loading-line">Préparation de la prochaine étape...</div>' +
      '</div>';

    overlay.querySelector("h2").textContent = confirmation.titre;
    overlay.querySelector("p").textContent = confirmation.texte;
    document.body.appendChild(overlay);

    const delai = respecterMouvementReduit() ? 300 : 1050;

    window.setTimeout(function() {
      overlay.classList.add("is-leaving");

      window.setTimeout(function() {
        overlay.remove();
        etapeActuelle += 1;
        mettreAJourEtape();
      }, respecterMouvementReduit() ? 10 : 180);
    }, delai);
  }

  function afficherErreur(message) {
    const erreur = obtenirElement("formError");
    if (!erreur) {
      return;
    }

    erreur.textContent = message;
    erreur.style.display = "block";
  }

  function masquerErreur() {
    const erreur = obtenirElement("formError");
    if (!erreur) {
      return;
    }

    erreur.textContent = "";
    erreur.style.display = "none";
  }

  const AG24_BP_DESIGN_STATE = {
    origin: "questionnaire",
    themeId: "executive_premium",
    logoUpload: null,
    slogan: "",
    projectBrandingToken: "",
    brandingLocalKey: "",
    brandingLoaded: false,
    brandingLoading: false,
    logoDirty: false
  };

  window.AG24BusinessPlanDesign =
    AG24_BP_DESIGN_STATE;

  function AG24_BP_BRANDING_normalizeLocal_(
    value
  ) {
    let text =
      String(
        value || ""
      )
        .trim()
        .toLowerCase();

    try {
      text =
        text
          .normalize("NFD")
          .replace(
            /[\u0300-\u036f]/g,
            ""
          );
    } catch (error) {
      // Normalization is an optimization only.
    }

    return text
      .replace(
        /[^a-z0-9]+/g,
        "-"
      )
      .replace(
        /^-+|-+$/g,
        ""
      );
  }

  function AG24_BP_BRANDING_localHash_(
    value
  ) {
    const text =
      String(
        value || ""
      );

    let left =
      0x811c9dc5;

    let right =
      0x9e3779b9;

    for (
      let index = 0;
      index < text.length;
      index += 1
    ) {
      const code =
        text.charCodeAt(
          index
        );

      left ^=
        code;

      left =
        Math.imul(
          left,
          0x01000193
        );

      right ^=
        code +
        index;

      right =
        Math.imul(
          right,
          0x85ebca6b
        );
    }

    return (
      (left >>> 0)
        .toString(16)
        .padStart(8, "0") +
      (right >>> 0)
        .toString(16)
        .padStart(8, "0")
    );
  }

  function AG24_BP_BRANDING_projectIdentity_() {
    let data = {};

    try {
      data =
        typeof collecterDonneesFormulaire ===
          "function"
          ? collecterDonneesFormulaire()
          : {};
    } catch (error) {
      data = {};
    }

    return {
      projectName:
        String(
          data.projectName || ""
        ).trim(),
      promoterName:
        String(
          data.promoterName || ""
        ).trim(),
      country:
        String(
          data.country || ""
        ).trim()
    };
  }

  function AG24_BP_BRANDING_localKey_() {
    const identity =
      AG24_BP_BRANDING_projectIdentity_();

    if (!identity.projectName) {
      return "";
    }

    const canonical =
      [
        identity.projectName,
        identity.promoterName,
        identity.country
      ]
        .map(
          AG24_BP_BRANDING_normalizeLocal_
        )
        .join("|");

    return (
      "ag24:bp:branding:v1:" +
      AG24_BP_BRANDING_localHash_(
        canonical
      )
    );
  }

  function AG24_BP_BRANDING_readLocalToken_(
    key
  ) {
    if (!key) {
      return "";
    }

    try {
      return String(
        window.localStorage
          .getItem(
            key
          ) || ""
      ).trim();
    } catch (error) {
      return "";
    }
  }

  function AG24_BP_BRANDING_writeLocalToken_(
    key,
    token
  ) {
    if (!key) {
      return;
    }

    try {
      if (token) {
        window.localStorage
          .setItem(
            key,
            String(token)
          );
      } else {
        window.localStorage
          .removeItem(
            key
          );
      }
    } catch (error) {
      // Browser persistence may be unavailable in private browsing.
    }
  }

  function afficherStatutBrandingProjet_(
    message,
    state
  ) {
    const status =
      obtenirElement(
        "bpProjectBrandingStatus"
      );

    if (!status) {
      return;
    }

    status.classList.remove(
      "is-saved",
      "is-pending",
      "is-error"
    );

    if (
      state === "saved"
    ) {
      status.classList.add(
        "is-saved"
      );
    } else if (
      state === "pending"
    ) {
      status.classList.add(
        "is-pending"
      );
    } else if (
      state === "error"
    ) {
      status.classList.add(
        "is-error"
      );
    }

    status.textContent =
      String(
        message || ""
      );
  }

  function mettreAJourActionRetraitLogo_() {
    const removeButton =
      obtenirElement(
        "bpDocumentLogoRemove"
      );

    if (!removeButton) {
      return;
    }

    removeButton.classList.toggle(
      "is-visible",
      Boolean(
        AG24_BP_DESIGN_STATE.logoUpload &&
        AG24_BP_DESIGN_STATE.logoUpload.dataUrl
      )
    );
  }

  function definirBrandingBusy_(
    busy
  ) {
    AG24_BP_DESIGN_STATE.brandingLoading =
      Boolean(
        busy
      );

    const generateButton =
      obtenirElement(
        "bpDesignGenerateButton"
      );

    if (generateButton) {
      generateButton.disabled =
        Boolean(
          busy
        );
    }
  }

  function lireLogoDesignBusinessPlan_(file) {
    return new Promise(function(resolve, reject) {
      if (!file) {
        resolve(null);
        return;
      }

      if (
        file.type !== "image/png" &&
        file.type !== "image/jpeg"
      ) {
        reject(
          new Error(
            "Le logo doit être au format PNG ou JPEG."
          )
        );
        return;
      }

      if (file.size > 2 * 1024 * 1024) {
        reject(
          new Error(
            "Le logo ne doit pas dépasser 2 Mo."
          )
        );
        return;
      }

      const reader = new FileReader();

      reader.onload = function() {
        resolve({
          dataUrl: String(
            reader.result || ""
          ),
          mimeType: file.type,
          name:
            file.name ||
            "logo-client"
        });
      };

      reader.onerror = function() {
        reject(
          new Error(
            "Impossible de lire le logo sélectionné."
          )
        );
      };

      reader.readAsDataURL(
        file
      );
    });
  }

  function afficherApercuLogoDesignBusinessPlan_(
    logoUpload
  ) {
    const preview =
      obtenirElement(
        "bpDocumentLogoPreview"
      );

    if (!preview) {
      return;
    }

    preview.innerHTML = "";

    if (
      !logoUpload ||
      !logoUpload.dataUrl
    ) {
      preview.textContent =
        "Aucun logo";

      mettreAJourActionRetraitLogo_();
      return;
    }

    const image =
      document.createElement(
        "img"
      );

    image.src =
      logoUpload.dataUrl;

    image.alt =
      logoUpload.name ||
      "Logo du projet";

    preview.appendChild(
      image
    );

    mettreAJourActionRetraitLogo_();
  }

  function chargerBrandingProjetBusinessPlan_() {
    const localKey =
      AG24_BP_BRANDING_localKey_();

    if (!localKey) {
      AG24_BP_DESIGN_STATE.brandingLocalKey =
        "";

      AG24_BP_DESIGN_STATE.projectBrandingToken =
        "";

      AG24_BP_DESIGN_STATE.brandingLoaded =
        false;

      afficherStatutBrandingProjet_(
        "Le logo pourra être enregistré dès que le projet est identifié.",
        ""
      );

      return;
    }

    if (
      AG24_BP_DESIGN_STATE.brandingLocalKey ===
        localKey &&
      (
        AG24_BP_DESIGN_STATE.brandingLoaded ||
        AG24_BP_DESIGN_STATE.logoDirty
      )
    ) {
      return;
    }

    if (
      AG24_BP_DESIGN_STATE.brandingLocalKey &&
      AG24_BP_DESIGN_STATE.brandingLocalKey !==
        localKey
    ) {
      AG24_BP_DESIGN_STATE.projectBrandingToken =
        "";

      AG24_BP_DESIGN_STATE.logoUpload =
        null;

      AG24_BP_DESIGN_STATE.slogan =
        "";

      AG24_BP_DESIGN_STATE.logoDirty =
        false;

      AG24_BP_DESIGN_STATE.brandingLoaded =
        false;

      const sloganField =
        obtenirElement(
          "bpDocumentSlogan"
        );

      if (sloganField) {
        sloganField.value =
          "";
      }

      afficherApercuLogoDesignBusinessPlan_(
        null
      );
    }

    AG24_BP_DESIGN_STATE.brandingLocalKey =
      localKey;

    const token =
      AG24_BP_BRANDING_readLocalToken_(
        localKey
      );

    if (!token) {
      AG24_BP_DESIGN_STATE.projectBrandingToken =
        "";

      AG24_BP_DESIGN_STATE.brandingLoaded =
        true;

      afficherStatutBrandingProjet_(
        "Aucun logo enregistré pour ce projet. Ajoutez-en un une seule fois.",
        ""
      );

      return;
    }

    if (
      typeof google === "undefined" ||
      !google.script ||
      !google.script.run
    ) {
      afficherStatutBrandingProjet_(
        "Impossible de charger le logo enregistré dans cet aperçu.",
        "error"
      );

      return;
    }

    definirBrandingBusy_(
      true
    );

    afficherStatutBrandingProjet_(
      "Chargement du logo déjà enregistré…",
      "pending"
    );

    const requestedKey =
      localKey;

    google.script.run
      .withSuccessHandler(
        function(result) {
          if (
            AG24_BP_DESIGN_STATE.brandingLocalKey !==
            requestedKey
          ) {
            definirBrandingBusy_(
              false
            );
            return;
          }

          if (
            !result ||
            result.success !== true ||
            result.found !== true
          ) {
            AG24_BP_BRANDING_writeLocalToken_(
              requestedKey,
              ""
            );

            AG24_BP_DESIGN_STATE.projectBrandingToken =
              "";

            AG24_BP_DESIGN_STATE.logoUpload =
              null;

            AG24_BP_DESIGN_STATE.brandingLoaded =
              true;

            AG24_BP_DESIGN_STATE.logoDirty =
              false;

            afficherApercuLogoDesignBusinessPlan_(
              null
            );

            afficherStatutBrandingProjet_(
              "Aucun logo enregistré pour ce projet. Ajoutez-en un une seule fois.",
              ""
            );

            definirBrandingBusy_(
              false
            );
            return;
          }

          AG24_BP_DESIGN_STATE.projectBrandingToken =
            token;

          AG24_BP_DESIGN_STATE.logoUpload =
            result.logoUpload ||
            null;

          AG24_BP_DESIGN_STATE.slogan =
            String(
              result.slogan || ""
            ).trim();

          AG24_BP_DESIGN_STATE.logoDirty =
            false;

          AG24_BP_DESIGN_STATE.brandingLoaded =
            true;

          const sloganField =
            obtenirElement(
              "bpDocumentSlogan"
            );

          if (sloganField) {
            sloganField.value =
              AG24_BP_DESIGN_STATE.slogan;
          }

          afficherApercuLogoDesignBusinessPlan_(
            AG24_BP_DESIGN_STATE.logoUpload
          );

          afficherStatutBrandingProjet_(
            result.hasLogo
              ? "Logo du projet déjà enregistré — il sera utilisé automatiquement."
              : "Identité du projet déjà enregistrée. Vous pouvez ajouter un logo.",
            "saved"
          );

          definirBrandingBusy_(
            false
          );
        }
      )
      .withFailureHandler(
        function(error) {
          AG24_BP_DESIGN_STATE.brandingLoaded =
            false;

          afficherStatutBrandingProjet_(
            error &&
            error.message
              ? error.message
              : "Impossible de charger le logo enregistré.",
            "error"
          );

          definirBrandingBusy_(
            false
          );
        }
      )
      .AG24_BP_PROJECT_BRANDING_GET_V1(
        token
      );
  }

  function enregistrerBrandingProjetAvantGeneration_(
    onSuccess
  ) {
    const identity =
      AG24_BP_BRANDING_projectIdentity_();

    const localKey =
      AG24_BP_BRANDING_localKey_();

    const sloganField =
      obtenirElement(
        "bpDocumentSlogan"
      );

    AG24_BP_DESIGN_STATE.slogan =
      sloganField
        ? String(
            sloganField.value || ""
          ).trim()
        : "";

    const needsPersistence =
      Boolean(
        AG24_BP_DESIGN_STATE.projectBrandingToken ||
        AG24_BP_DESIGN_STATE.logoUpload ||
        AG24_BP_DESIGN_STATE.slogan ||
        AG24_BP_DESIGN_STATE.logoDirty
      );

    if (!needsPersistence) {
      onSuccess();
      return;
    }

    if (
      !identity.projectName ||
      !localKey
    ) {
      afficherStatutBrandingProjet_(
        "Le projet doit être identifié avant d’enregistrer son logo.",
        "error"
      );
      return;
    }

    if (
      typeof google === "undefined" ||
      !google.script ||
      !google.script.run
    ) {
      afficherStatutBrandingProjet_(
        "Le service d’enregistrement du logo est indisponible.",
        "error"
      );
      return;
    }

    const logoAction =
      AG24_BP_DESIGN_STATE.logoDirty
        ? (

  function estParcoursFinanceurDirect_() {
    const field =
      obtenirElement("fundingType");

    const raw =
      String(
        field && field.value
          ? field.value
          : ""
      );

    let normalized =
      raw.toLowerCase();

    try {
      normalized =
        normalized
          .normalize("NFD")
          .replace(/[\u0300-\u036f]/g, "");
    } catch (error) {}

    return (
      normalized.indexOf("pret") !== -1 ||
      normalized.indexOf("banque") !== -1 ||
      normalized.indexOf("bancaire") !== -1 ||
      normalized.indexOf("credit") !== -1 ||
      normalized.indexOf("emprunt") !== -1
    );
  }

  function construireStandardFinanceurDirect_(donnees) {
    if (
      typeof window.construireDonneesStandardTransition ===
      "function"
    ) {
      return window.construireDonneesStandardTransition();
    }

    donnees = donnees || {};

    return {
      nomProjet: donnees.projectName || "",
      nomPromoteur: donnees.promoterName || "",
      email: donnees.email || "",
      pays: donnees.country || "",
      stade: donnees.stage || "",
      descriptionProjet: donnees.solution || "",
      problemeResolu: donnees.problem || "",
      clientsCibles: donnees.targetCustomers || "",
      zoneMarche: donnees.marketArea || "",
      concurrents: donnees.competitors || "",
      avantageConcurrentiel: donnees.valueProposition || "",
      sourcesRevenus: donnees.revenueModel || "",
      prix: donnees.pricing || "",
      secteur: donnees.sector || "",
      coutsPrincipaux: donnees.mainCosts || "",
      equipe: donnees.team || "",
      typeFinancement: donnees.fundingType || "",
      besoinFinancement: donnees.fundingNeed || "",
      utilisationFonds: donnees.useOfFunds || "",
      impact: donnees.impact || "",
      risques: donnees.risks || ""
    };
  }

  function configurerHandoffFinanceur_(resultat) {
    const link =
      resultat && resultat.lienBancable
        ? String(resultat.lienBancable)
        : "";

    if (!link) {
      throw new Error(
        "Le lien sécurisé vers l’analyse finale est indisponible."
      );
    }

    window.businessPlanDossierId =
      resultat.dossierId || "";

    window.businessPlanAdvancedLink =
      link;

    const animation =
      obtenirElement("generationAnimation");

    const succes =
      obtenirElement("generationSuccess");

    if (animation) {
      animation.classList.add("hidden");
    }

    if (!succes) {
      throw new Error(
        "L’écran de poursuite du Business Plan est indisponible."
      );
    }

    const title =
      succes.querySelector("h2");

    const successMessage =
      succes.querySelector(".success-message");

    const welcomeMessage =
      succes.querySelector(".welcome-message");

    const button =
      succes.querySelector(".main-button");

    if (title) {
      title.textContent =
        "Analyse initiale terminée";
    }

    if (successMessage) {
      successMessage.textContent =
        "Votre dossier est enregistré. Nous allons maintenant compléter uniquement les informations nécessaires au document final.";
    }

    if (welcomeMessage) {
      welcomeMessage.textContent =
        "Aucun Business Plan intermédiaire n’a été généré.";
    }

    if (button) {
      button.removeAttribute("onclick");
      button.innerHTML =
        "<span>Continuer l’analyse et générer le document final</span>";

      button.onclick =
        function() {
          const anchor =
            document.createElement("a");

          anchor.href = link;
          anchor.target = "_top";
          anchor.rel = "noopener noreferrer";
          anchor.style.display = "none";

          document.body.appendChild(anchor);
          anchor.click();
          anchor.remove();
        };
    }

    succes.classList.remove("hidden");
    generationEnCours = false;
  }

  function lancerParcoursFinalFinanceur_() {
    if (generationEnCours) {
      return;
    }

    generationEnCours = true;
    masquerErreur();
    reinitialiserAnimation();
    afficherPage("generationPage");

    const donnees =
      collecterDonneesFormulaire();

    const standard =
      construireStandardFinanceurDirect_(
        donnees
      );

    const bridge =
      String(
        window.AFRIGREEN_DOCUMENT_BRIDGE ||
        ""
      ).trim();

    const title =
      obtenirElement("generationTitle");

    const text =
      obtenirElement("generationText");

    if (title) {
      title.textContent =
        "Analyse de votre dossier...";
    }

    if (text) {
      text.textContent =
        "Nous préparons votre dossier unique et détectons les informations encore nécessaires avant la génération finale.";
    }

    if (
      typeof google === "undefined" ||
      !google.script ||
      !google.script.run
    ) {
      afficherEchecGeneration(
        "Le service Google Apps Script est indisponible."
      );
      return;
    }

    google.script.run
      .withSuccessHandler(
        function(resultat) {
          try {
            configurerHandoffFinanceur_(
              resultat
            );
          } catch (error) {
            afficherEchecGeneration(
              error && error.message
                ? error.message
                : String(error)
            );
          }
        }
      )
      .withFailureHandler(
        function(error) {
          afficherEchecGeneration(
            error && error.message
              ? error.message
              : "Impossible de préparer le dossier final."
          );
        }
      )
      .preparerTransitionBusinessPlanBancable(
        "",
        standard,
        bridge,
        String(
          window.businessPlanImportContextId || ""
        ).trim()
      );
  }

  window.lancerParcoursFinalFinanceur =
    lancerParcoursFinalFinanceur_;

  function lancerGeneration() {
    if (generationEnCours) {
      return;
    }

    /*
     * Invariant de parcours :
     * une demande bancaire ne génère jamais un Business Plan intermédiaire.
     * Peu importe le point d'entrée (questionnaire, import, design),
     * on bascule vers l'analyse approfondie puis une génération finale unique.
     */
    if (
      typeof estParcoursFinanceurDirect_ === "function" &&
      estParcoursFinanceurDirect_()
    ) {
      lancerParcoursFinalFinanceur_();
      return;
    }

    generationEnCours = true;
    masquerErreur();
    reinitialiserAnimation();
    afficherPage("generationPage");

    const donnees = collecterDonneesFormulaire();

    const documentDesign =
      window.AG24BusinessPlanDesign ||
      AG24_BP_DESIGN_STATE;

    donnees.documentTheme =
      String(
        documentDesign.themeId ||
        "executive_premium"
      )
        .trim()
        .toLowerCase();

    donnees.organizationSlogan =
      String(
        documentDesign.slogan || ""
      ).trim();

    const projectBrandingToken =
      String(
        documentDesign.projectBrandingToken ||
        ""
      ).trim();

    if (projectBrandingToken) {
      donnees.projectBrandingToken =
        projectBrandingToken;

      delete donnees.logoUpload;
    } else if (
      documentDesign.logoUpload &&
      documentDesign.logoUpload.dataUrl
    ) {
      donnees.logoUpload =
        documentDesign.logoUpload;
    } else {
      delete donnees.logoUpload;
    }

    const agBridge = String(
      window.AFRIGREEN_DOCUMENT_BRIDGE || ""
    ).trim();

    if (agBridge) {
      donnees.agBridge = agBridge;
    }
    const titre = obtenirElement("generationTitle");
    const texte = obtenirElement("generationText");

    let indexAnimation = 0;
    let animationTerminee = false;
    let appelServeurTermine = false;
    let resultatServeur = null;
    let intervalle = null;

    afficherMessageGeneration(0);

    intervalle = window.setInterval(function() {
      if (indexAnimation < etapesGeneration.length - 1) {
        indexAnimation += 1;
        afficherMessageGeneration(indexAnimation);
        return;
      }

      animationTerminee = true;
      verifierFinGeneration();
    }, 1500);

    if (
      typeof google === "undefined" ||
      !google.script ||
      !google.script.run
    ) {
      window.clearInterval(intervalle);
      afficherEchecGeneration(
        "Le service Google Apps Script est indisponible dans cet aperçu. Ouvrez l’application depuis son URL de déploiement."
      );
      return;
    }

    function lancerGenerationServeur_() {
      google.script.run
        .withSuccessHandler(function(resultat) {
          appelServeurTermine = true;

          try {
            resultatServeur =
              typeof resultat === "string"
                ? JSON.parse(resultat)
                : resultat;
          } catch (erreurParsing) {
            resultatServeur = {
              success: false,
              message: "La réponse du serveur est illisible.",
              error: String(erreurParsing)
            };
          }

          verifierFinGeneration();
        })
        .withFailureHandler(function(erreur) {
          window.clearInterval(intervalle);
          afficherEchecGeneration(
            erreur && erreur.message
              ? erreur.message
              : "Impossible de générer le Business Plan."
          );
          console.error("Erreur de génération :", erreur);
        })
        .genererBusinessPlanWeb(donnees);
    }

    if (
      google.script.url &&
      typeof google.script.url.getLocation === "function"
    ) {
      google.script.url.getLocation(function(location) {
        const params = location && location.parameter ? location.parameter : {};
        const bridge = String(
          params.agBridge || window.AFRIGREEN_DOCUMENT_BRIDGE || ""
        ).trim();

        if (bridge) {
          donnees.agBridge = bridge;
        }

        lancerGenerationServeur_();
      });
    } else {
      lancerGenerationServeur_();
    }

    function afficherMessageGeneration(position) {
      const etape = etapesGeneration[position];
      if (!etape) {
        return;
      }

      if (titre) {
        titre.textContent = etape.titre;
      }

      if (texte) {
        texte.textContent = etape.texte;
      }
    }

    function verifierFinGeneration() {
      if (!animationTerminee || !appelServeurTermine) {
        return;
      }

      window.clearInterval(intervalle);

      const docUrl =
        resultatServeur && (
          resultatServeur.docUrl ||
          resultatServeur.url ||
          resultatServeur.documentUrl ||
          resultatServeur.businessPlanLink ||
          ""
        );

      const docId =
        resultatServeur && (
          resultatServeur.docId ||
          resultatServeur.documentId ||
          resultatServeur.id ||
          ""
        );

      const pdfUrl =
        resultatServeur && (
          resultatServeur.pdfUrl ||
          resultatServeur.pdfLink ||
          resultatServeur.businessPlanPdfLink ||
          ""
        );

      const pdfDownloadUrl =
        resultatServeur && (
          resultatServeur.pdfDownloadUrl ||
          resultatServeur.downloadUrl ||
          resultatServeur.businessPlanPdfDownload ||
          pdfUrl ||
          docUrl ||
          ""
        );

      const securePdfAvailable =
        Boolean(
          resultatServeur &&
          resultatServeur.pdfId &&
          resultatServeur.pdfAccessToken
        );

      if (
        !resultatServeur ||
        resultatServeur.success !== true ||
        (!pdfDownloadUrl && !securePdfAvailable)
      ) {
        afficherEchecGeneration(
          resultatServeur && (resultatServeur.message || resultatServeur.error)
            ? (resultatServeur.message || resultatServeur.error)
            : "Le document ou son lien de téléchargement est indisponible."
        );

        console.error(
          "Résultat reçu du serveur :",
          resultatServeur
        );
        return;
      }

      window.businessPlanLink = docUrl;
      window.businessPlanId = docId;
      window.businessPlanPdfLink = pdfUrl;
      window.businessPlanPdfDownload = pdfDownloadUrl;
      window.businessPlanPdfId =
        resultatServeur.pdfId || '';
      window.businessPlanPdfAccessToken =
        resultatServeur.pdfAccessToken || '';
      window.businessPlanResult = resultatServeur;
      window.resultatBusinessPlan = resultatServeur;

      const animation = obtenirElement("generationAnimation");
      const succes = obtenirElement("generationSuccess");

      if (animation) {
        animation.classList.add("hidden");
      }

      if (succes) {
        succes.classList.remove("hidden");
      }

      generationEnCours = false;

      window.setTimeout(function() {
        if (typeof window.ouvrirResultatPremium === "function") {
          window.ouvrirResultatPremium();
        }

        afficherStatutSynchronisationDashboard_(
          resultatServeur.dashboardSync
        );
      }, respecterMouvementReduit() ? 180 : 900);
    }
  }

  function afficherStatutSynchronisationDashboard_(dashboardSync) {
    const element = document.getElementById("dashboardSyncStatus");

    if (!element) {
      return;
    }

    if (dashboardSync && dashboardSync.success === true) {
      element.textContent =
        "✓ Votre PDF a été ajouté à la bibliothèque Documents AfriGreen24.";
      return;
    }

    if (dashboardSync && dashboardSync.error) {
      element.textContent =
        "⚠ PDF créé, mais synchronisation Dashboard impossible : " +
        dashboardSync.error;
      return;
    }

    element.textContent =
      "⚠ PDF créé, mais aucun bridge Dashboard n’a été reçu.";
  }

  function afficherEchecGeneration(message) {
    generationEnCours = false;

    const animation = obtenirElement("generationAnimation");
    const titre = obtenirElement("generationTitle");
    const texte = obtenirElement("generationText");
    const anneau = animation ? animation.querySelector(".loading-ring") : null;

    if (anneau) {
      anneau.style.display = "none";
    }

    if (titre) {
      titre.textContent = "La génération a été interrompue.";
    }

    if (texte) {
      texte.textContent = message;
    }

    if (animation && !obtenirElement("generationRetryButton")) {
      const bouton = document.createElement("button");
      bouton.type = "button";
      bouton.id = "generationRetryButton";
      bouton.className = "main-button ag-generation-retry";
      bouton.innerHTML =
        '<span>Réessayer</span>' +
        '<svg class="button-icon" aria-hidden="true"><use href="#icon-arrow-right"></use></svg>';
      bouton.addEventListener("click", lancerGeneration);
      animation.appendChild(bouton);
    }
  }

  function reinitialiserAnimation() {
    const animation = obtenirElement("generationAnimation");
    const succes = obtenirElement("generationSuccess");
    const titre = obtenirElement("generationTitle");
    const texte = obtenirElement("generationText");
    const boutonReessayer = obtenirElement("generationRetryButton");
    const anneau = animation ? animation.querySelector(".loading-ring") : null;

    if (animation) {
      animation.classList.remove("hidden");
    }

    if (succes) {
      succes.classList.add("hidden");
    }

    if (anneau) {
      anneau.style.display = "";
    }

    if (boutonReessayer) {
      boutonReessayer.remove();
    }

    if (titre) {
      titre.textContent = etapesGeneration[0].titre;
    }

    if (texte) {
      texte.textContent = etapesGeneration[0].texte;
    }
  }

  function valeurResultat(id, valeurParDefaut) {
    const champ = obtenirElement(id);
    const valeur = champ ? String(champ.value || "").trim() : "";
    return valeur || valeurParDefaut;
  }

  function definirTexteResultat(id, valeur) {
    const element = obtenirElement(id);
    if (element) {
      element.textContent = valeur;
    }
  }

  function obtenirBesoinPrincipalPremium() {
    const resultatComplet =
      window.businessPlanResult ||
      window.resultatBusinessPlan ||
      {};

    const profilCommercial =
      resultatComplet.profilCommercial ||
      resultatComplet.profil_commercial ||
      {};

    const besoinServeur = String(
      profilCommercial.besoinPrincipal ||
      profilCommercial.besoin_principal ||
      resultatComplet.besoinPrincipal ||
      ""
    ).trim();

    if (besoinServeur) {
      return besoinServeur;
    }

    const typeFinancement = valeurResultat("fundingType", "");
    const montant = valeurResultat("fundingNeed", "");
    const stade = valeurResultat("stage", "");

    if (typeFinancement && montant) {
      return (
        "Préparer une demande de " +
        typeFinancement.toLowerCase() +
        " de " +
        montant +
        " et sécuriser un plan d’utilisation crédible des fonds."
      );
    }

    if (typeFinancement) {
      return (
        "Structurer une stratégie de " +
        typeFinancement.toLowerCase() +
        " et préparer un dossier convaincant pour les financeurs."
      );
    }

    if (stade) {
      return (
        "Transformer le stade actuel — " +
        stade.toLowerCase() +
        " — en prochaines actions mesurables et finançables."
      );
    }

    return "Structurer le passage à l’action et la stratégie de financement du projet.";
  }

  function preparerResultatPremium() {
    const nomProjet = valeurResultat("projectName", "Votre projet");
    const promoteur = valeurResultat("promoterName", "Entrepreneur");
    const pays = valeurResultat("country", "À préciser");
    const secteur = valeurResultat("sector", "À préciser");
    const financement = valeurResultat("fundingType", "À définir");
    const montant = valeurResultat("fundingNeed", "À déterminer");
    const lienDocument =
      window.businessPlanLink ||
      window.businessPlanPdfLink ||
      window.businessPlanPdfDownload ||
      "#";

    definirTexteResultat("resultProjectName", nomProjet);
    definirTexteResultat("resultPromoterName", promoteur);
    definirTexteResultat("resultPromoterGreeting", promoteur);
    definirTexteResultat("resultCountry", pays);
    definirTexteResultat("resultSector", secteur);
    definirTexteResultat("resultFundingType", financement);
    definirTexteResultat("resultFundingNeed", montant);
    definirTexteResultat("resultMainNeed", obtenirBesoinPrincipalPremium());

    const lien = obtenirElement("resultPdfLink");
    if (lien) {
      const securePdf =
        Boolean(
          window.businessPlanPdfId &&
          window.businessPlanPdfAccessToken
        );

      lien.href = securePdf ? "#" : lienDocument;
      lien.setAttribute(
        "aria-disabled",
        !securePdf && lienDocument === "#" ? "true" : "false"
      );

      lien.onclick = securePdf
        ? function(event) {
            event.preventDefault();
            telechargerBusinessPlanPremium(false);
          }
        : null;
    }
  }

  function ouvrirResultatPremium() {
    const securePdf =
      Boolean(
        window.businessPlanPdfId &&
        window.businessPlanPdfAccessToken
      );

    if (
      !securePdf &&
      !window.businessPlanPdfDownload &&
      !window.businessPlanPdfLink
    ) {
      afficherEchecGeneration("Le PDF n’est pas encore disponible.");
      return;
    }

    preparerResultatPremium();
    afficherPage("resultPage");

    window.setTimeout(function() {
      telechargerBusinessPlanPremium(true);
    }, respecterMouvementReduit() ? 80 : 220);
  }

  function telechargerBusinessPlanPremium(silencieux) {
    const fileId =
      String(window.businessPlanPdfId || "").trim();

    const accessToken =
      String(window.businessPlanPdfAccessToken || "").trim();

    if (fileId && accessToken) {
      google.script.run
        .withSuccessHandler(function(resultat) {
          if (!resultat || resultat.success !== true || !resultat.base64) {
            if (!silencieux) {
              afficherEchecGeneration("Le téléchargement sécurisé a échoué.");
            }
            return;
          }

          telechargerBase64Pdf_(
            resultat.base64,
            resultat.mimeType || "application/pdf",
            resultat.fileName || "Business Plan.pdf"
          );
        })
        .withFailureHandler(function(error) {
          if (!silencieux) {
            afficherEchecGeneration(
              error && error.message
                ? error.message
                : "Le téléchargement sécurisé a échoué."
            );
          }
        })
        .telechargerPdfBusinessPlanStandard(
          fileId,
          accessToken
        );

      return;
    }

    const lien =
      window.businessPlanPdfDownload ||
      window.businessPlanPdfLink;

    if (!lien) {
      if (!silencieux) {
        afficherEchecGeneration("Le PDF n’est pas encore disponible.");
      }
      return;
    }

    const ancre = document.createElement("a");
    ancre.href = lien;
    ancre.target = "_blank";
    ancre.rel = "noopener noreferrer";
    ancre.style.display = "none";
    document.body.appendChild(ancre);
    ancre.click();
    ancre.remove();
  }

  function telechargerBase64Pdf_(base64, mimeType, fileName) {
    const binary = window.atob(String(base64 || ""));
    const bytes = new Uint8Array(binary.length);

    for (let index = 0; index < binary.length; index += 1) {
      bytes[index] = binary.charCodeAt(index);
    }

    const blob = new Blob(
      [bytes],
      { type: mimeType || "application/pdf" }
    );

    const url = URL.createObjectURL(blob);
    const ancre = document.createElement("a");
    ancre.href = url;
    ancre.download = fileName || "Business Plan.pdf";
    ancre.style.display = "none";
    document.body.appendChild(ancre);
    ancre.click();
    ancre.remove();

    window.setTimeout(function() {
      URL.revokeObjectURL(url);
    }, 1500);
  }

  function respecterMouvementReduit() {
    return Boolean(
      window.matchMedia &&
      window.matchMedia("(prefers-reduced-motion: reduce)").matches
    );
  }

  function installerStylesJavascript() {
    if (obtenirElement("agJavascriptStyles")) {
      return;
    }

    const style = document.createElement("style");
    style.id = "agJavascriptStyles";
    style.textContent = `
      .ag-step-confirmation-overlay {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: grid;
        place-items: center;
        padding: 24px;
        background: rgba(3, 47, 32, 0.58);
        backdrop-filter: blur(10px);
        opacity: 1;
        transition: opacity 180ms ease;
      }

      .ag-step-confirmation-overlay.is-leaving {
        opacity: 0;
      }

      .ag-step-confirmation {
        width: min(100%, 520px);
        padding: 42px 34px;
        text-align: center;
        background: #ffffff;
        border: 1px solid rgba(11, 107, 58, 0.12);
        border-radius: 28px;
        box-shadow: 0 30px 80px rgba(3, 47, 32, 0.24);
        animation: agConfirmationIn 320ms ease both;
      }

      .ag-step-confirmation h2 {
        margin: 0 0 10px;
        color: #10231b;
        font-size: clamp(1.7rem, 5vw, 2.25rem);
        line-height: 1.18;
      }

      .ag-step-confirmation p {
        margin: 0;
        color: #5e7168;
      }

      .ag-mini-loading-line {
        position: relative;
        margin-top: 24px;
        padding-top: 16px;
        overflow: hidden;
        color: #0b6b3a;
        font-size: 0.8rem;
        font-weight: 800;
      }

      .ag-mini-loading-line::before {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 4px;
        content: "";
        background: #e3eee8;
        border-radius: 999px;
      }

      .ag-mini-loading-line::after {
        position: absolute;
        top: 0;
        left: 0;
        width: 42%;
        height: 4px;
        content: "";
        background: linear-gradient(90deg, #0b6b3a, #6fba16);
        border-radius: 999px;
        animation: agConfirmationLoad 900ms ease-in-out infinite;
      }

      .ag-generation-retry {
        margin-top: 22px;
      }

      @keyframes agConfirmationIn {
        from {
          opacity: 0;
          transform: translateY(14px) scale(0.98);
        }
        to {
          opacity: 1;
          transform: translateY(0) scale(1);
        }
      }

      @keyframes agConfirmationLoad {
        from { transform: translateX(-120%); }
        to { transform: translateX(340%); }
      }

      @media (prefers-reduced-motion: reduce) {
        .ag-step-confirmation,
        .ag-mini-loading-line::after {
          animation: none !important;
        }
      }
    `;

    document.head.appendChild(style);
  }

  window.preparerResultatPremium = preparerResultatPremium;
  window.ouvrirResultatPremium = ouvrirResultatPremium;
  window.telechargerBusinessPlanPremium = telechargerBusinessPlanPremium;

  function initialiserApplication() {
    installerStylesJavascript();
    mettreAJourEtape(false);

    document.addEventListener("input", function(event) {
      if (event.target.matches("input, textarea, select")) {
        nettoyerEtatChamp(event.target);

    });

    document.addEventListener("change", function(event) {
      if (event.target.matches("select")) {
        nettoyerEtatChamp(event.target);
        masquerErreur();
      }
    });
  }

  initialiserApplication();
</script>
